name: Aplicar curva mensual de potencia

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-power-curve-analysis.yml'
      - 'scripts/apply_power_curve_analysis.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar parche
        run: python3 scripts/apply_power_curve_analysis.py

      - name: Instalar dependencias
        working-directory: front
        run: npm ci

      - name: Verificar build
        working-directory: front
        run: npm run build

      - name: Confirmar implementación
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add front/app/invoice-analysis-panel.tsx front/app/power-curve.module.css
          git rm .github/workflows/apply-power-curve-analysis.yml scripts/apply_power_curve_analysis.py
          git commit -m "feat: curva mensual de potencia y Excel por suministro"
          git push

# ejecución validada
