name: Aplicar potencia por curva en resumen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dashboard-power-curve.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Aplicar parche
        run: python scripts/apply_dashboard_power_curve.py
      - name: Instalar dependencias
        working-directory: front
        run: npm ci
      - name: Verificar build
        working-directory: front
        run: npm run build
      - name: Commit
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add front/app/page.tsx
          git rm scripts/apply_dashboard_power_curve.py .github/workflows/apply-dashboard-power-curve.yml
          git commit -m "feat: usar curva mensual de potencia en resumen"
          git push
